# ====================================================================
# Development Environment Profile
# ====================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/insurance_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

app.seed.enabled=${SEED_DATA_ENABLED:true}

# Useful Development Logging
logging.level.com.insurance=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
